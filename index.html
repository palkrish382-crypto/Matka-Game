<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live 3-Card Matka</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .game-container { background-color: #1e293b; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 800px; padding: 24px; }
        .game-header { text-align: center; border-bottom: 2px solid #334155; padding-bottom: 16px; margin-bottom: 20px; }
        .game-header h1 { color: #38bdf8; font-size: 2rem; }
        .room-info { margin: 10px 0; background: #0f172a; padding: 8px; border-radius: 6px; text-align: center; font-size: 0.9rem; }
        .cards-container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin: 20px 0; }
        .playing-card { background-color: #ffffff; color: #000000; width: 120px; height: 180px; border-radius: 8px; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: 0 6px 12px rgba(0,0,0,0.3); cursor: pointer; transition: transform 0.2s; }
        .playing-card:hover { transform: translateY(-5px); }
        .playing-card.selected { border: 4px solid #38bdf8; transform: scale(1.05); }
        .playing-card.ace, .playing-card.king { color: #dc2626; }
        .playing-card.jack { color: #1e293b; }
        .card-corner { position: absolute; font-size: 1.1rem; font-weight: bold; }
        .top-left { top: 8px; left: 8px; }
        .bottom-right { bottom: 8px; right: 8px; transform: rotate(180deg); }
        .card-suit-center { font-size: 3rem; }
        .card-name { font-size: 0.85rem; font-weight: 800; border-top: 1px solid #cbd5e1; padding-top: 4px; width: 80%; text-align: center; }
        .players-list { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; }
        .player-row { display: flex; justify-content: space-between; padding: 10px 16px; background-color: #334155; border-radius: 6px; }
        .status-msg { text-align: center; font-weight: bold; margin: 15px 0; color: #f59e0b; }
    </style>
    <!-- Yahan humne official internet wala CDN script daal diya hai -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1>Card Matka Arena</h1>
            <div class="room-info">Room Link: <span id="roomLink">Connecting...</span></div>
        </header>
        <div class="status-msg" id="gameStatus">Waiting for players to join (0/5)...</div>
        <section class="card-display-section">
            <div class="cards-container">
                <div class="playing-card ace" onclick="selectCard('EKKA')">
                    <div class="card-corner top-left">A<span>♦</span></div>
                    <div class="card-suit-center">♦</div>
                    <div class="card-name">EKKA</div>
                </div>
                <div class="playing-card jack" onclick="selectCard('GULAM')">
                    <div class="card-corner top-left">J<span>♠</span></div>
                    <div class="card-suit-center">♠</div>
                    <div class="card-name">GULAM</div>
                </div>
                <div class="playing-card king" onclick="selectCard('BADSHAH')">
                    <div class="card-corner top-left">K<span>♥</span></div>
                    <div class="card-suit-center">♥</div>
                    <div class="card-name">BADSHAH</div>
                </div>
            </div>
        </section>
        <section class="players-section">
            <h2>Players in Pool</h2>
            <div class="players-list" id="playersList"></div>
        </section>
    </div>
    <script>
        // Yahan khali io() ki jagah humne aapka Render backend URL connect kar diya hai
        const socket = io("https://matka-game.onrender.com");
        let selectedBet = null;
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'default-room';
        document.getElementById('roomLink').innerText = window.location.href;
        socket.emit('joinRoom', { roomId });
        function selectCard(cardName) {
            selectedBet = cardName;
            document.querySelectorAll('.playing-card').forEach(c => c.classList.remove('selected'));
            event.currentTarget.classList.add('selected');
            socket.emit('placeBet', { roomId, bet: cardName });
        }
        socket.on('roomUpdate', (data) => {
            document.getElementById('gameStatus').innerText = `Players: ${data.count}/5 locked in.`;
            const list = document.getElementById('playersList');
            list.innerHTML = '';
            data.players.forEach(p => {
                list.innerHTML += `<div class="player-row"><span>${p.id === socket.id ? 'You (Player)' : 'Opponent'}</span><span>Status: ${p.hasBet ? 'Bet Placed' : 'Choosing...'}</span></div>`;
            });
        });
        socket.on('gameResults', (results) => {
            const myResult = results.find(r => r.id === socket.id);
            if(myResult.isWinner) {
                document.getElementById('gameStatus').innerText = `🎉 You Won! Payout: ₹100`;
                document.getElementById('gameStatus').style.color = "#4ade80";
            } else {
                document.getElementById('gameStatus').innerText = `❌ Round Over. Better luck next time!`;
                document.getElementById('gameStatus').style.color = "#ef4444";
            }
        });
    </script>
</body>
</html>
